services:
  app:
    build:
      context: .
      dockerfile: ./deploy/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: revenue-ledger-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - revenue-ledger

  nginx:
    image: nginx:1.27-alpine
    container_name: revenue-ledger-nginx
    restart: unless-stopped
    ports:
      - "8086:80"
    volumes:
      - ./:/var/www/html
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - revenue-ledger

  mysql:
    image: mysql:8.4
    container_name: revenue-ledger-mysql
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: revenue_ledger
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-proot"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - revenue-ledger

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: revenue-ledger-phpmyadmin
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - revenue-ledger

  queue:
    build:
      context: .
      dockerfile: ./deploy/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: revenue-ledger-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --tries=5 --timeout=90
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - revenue-ledger

volumes:
  mysql-data:

networks:
  revenue-ledger:
    driver: bridge